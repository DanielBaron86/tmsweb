<div class="bg-white border border-gray-200 dark:bg-white/[0.03] dark:border-gray-800 rounded-2xl">
  <div class="px-6 py-5">
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90"> User </h3>
    <!---->
  </div>
  <div class="p-4 border-t border-gray-100 dark:border-gray-800 sm:p-6">
    <div class="space-y-6">
      <form>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          <div class="col-span-2 sm:col-span-1">
            <app-label for="firstName">
            </app-label>
            <app-input-field type="text" placeholder="Enter first name" id="firstName">
            </app-input-field>
          </div>
          <div class="col-span-2 sm:col-span-1">
            <app-label for="lastName">
            </app-label>
            <input [field]="createForm.email" type="text" id="lastname"  placeholder="Name" class="h-11 w-full rounded-lg border appearance-none px-4 py-2.5 text-sm shadow-theme-xs placeholder:text-gray-400 focus:outline-hidden focus:ring-3 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 bg-transparent text-gray-800 border-gray-300 focus:border-brand-300 focus:ring-brand-500/20 dark:border-gray-700 dark:focus:border-brand-800">
          </div>
          <div class="col-span-2">
            <app-label for="username">
            </app-label>
            <app-input-field type="text" placeholder="Enter username" id="username">
            </app-input-field>
          </div>
          <div class="col-span-2">
            <app-label for="email">
            </app-label>
            <app-input-field type="text" placeholder="Enter email address" id="email">
            </app-input-field>
          </div>
          <div class="col-span-2">
            <app-label for="subject">
            </app-label>
            <app-select [className]="'bg-gray-50 dark:bg-gray-800'" [options]="options">
            </app-select>
          </div>
          <div class="col-span-2">
            <app-label for="password">
            </app-label>
            <app-input-field type="text" placeholder="Enter password" id="password">
            </app-input-field>
          </div>
          <div class="col-span-2">
            <app-label for="repeat_password">
            </app-label>
            <app-input-field type="text" placeholder="Repeat password" id="repeat_password">
            </app-input-field>
          </div>
          <div class="col-span-2">
            <app-button [variant]="'primary'" [className]="'w-full inline-flex items-center justify-center gap-2 rounded-lg transition w-full px-4 py-3 text-sm bg-brand-500 text-white shadow-theme-xs hover:bg-brand-600 disabled:bg-brand-300'" type="submit">
              Submit
            </app-button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
