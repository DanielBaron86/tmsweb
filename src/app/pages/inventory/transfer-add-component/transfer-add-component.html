<app-query-builder
  (emitQueryFilter)="ReceiveFilters($event)"
  [queryTitle]="'Location Query Filters'"
  [selectOptions]="availableOptions"
>
</app-query-builder>
<app-select-with-search
  [options]="options()"
  (emitSelected)="ReceiveLocation($event)"
></app-select-with-search>

<div
  class="flex flex-col justify-between gap-6 rounded-2xl border border-gray-200 bg-white px-6 py-5 sm:flex-row sm:items-center dark:border-gray-800 dark:bg-white/3"
>
  <div class="space-y-6">
    <input
      (change)="SetDescription(tDesk.value)"
      #tDesk
      type="text"
      class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-brand-500 dark:border-gray-800 dark:bg-white/3"
      placeholder="Task Description"
    />
    <p class="text-sm text-gray-500 sm:pl-3 dark:text-gray-400">
      Transferring items to {{ locationOption().text }}
    </p>
    @for (item of selectedItems(); track item.id) {
      <ul class="flex flex-col">
        <li class="border-b border-gray-200 last:border-b-0 dark:border-gray-800">
          <button
            (click)="RemoveItem(item.id)"
            class="flex w-full items-center gap-3 px-3 py-2.5 text-sm font-medium text-gray-500 hover:bg-brand-50 hover:text-brand-500 dark:text-gray-400 dark:hover:bg-brand-500/[0.12] dark:hover:text-brand-400"

                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="fill-current"

                  clip-rule="evenodd"
