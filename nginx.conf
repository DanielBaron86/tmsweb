server {
    listen 80;
    server_name tmsweb.danielsplaygrounds.com;

    root /usr/share/nginx/html;
    index index.html index.csr.html;

    # Angular routing support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (important)
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 6M;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
